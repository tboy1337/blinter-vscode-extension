name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup vendor binary
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./setup-vendor.ps1

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Coverage gate (>=95%)
        run: npm run test:coverage

      - name: Security audit (production deps)
        run: npm run test:security:audit

      - name: Security audit (dev deps)
        run: npm run audit:dev

      - name: Run extension tests
        run: npm test

      - name: Package VSIX
        run: npm run package:vsix

      - name: Verify VSIX contents
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./tools/verify-vsix.ps1

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: blinter-vsix
          path: "*.vsix"
          retention-days: 2
